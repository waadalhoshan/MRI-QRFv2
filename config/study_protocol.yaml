project: MRI-QRF
version: "2.0-documentation"

seeds:
  subject_split: 2026
  corruption_global: 42
  model_training: [13, 47, 101]
  bootstrap: 2026

classes:
  - index: 0
    name: Non-Demented
    cdr: 0.0
  - index: 1
    name: Very Mild Dementia
    cdr: 0.5
  - index: 2
    name: Mild Dementia
    cdr: 1.0
  - index: 3
    name: Moderate Dementia
    cdr: 2.0

binary_task:
  negative: 'CDR=0'
  positive: 'CDR>0 (0.5, 1, 2)'
  reuse_multiclass_subject_splits: true
  OASIS_1:
    negative: {train: 95, val: 20, test: 20}
    positive: {train: 70, val: 14, test: 16}
  OASIS_2:
    negative: {train: 51, val: 11, test: 11}
    positive: {train: 53, val: 12, test: 12}

datasets:
  OASIS_1:
    selection: "MR1, mpr-1, CDR-labelled subjects"
    subjects:
      Non-Demented: 135
      Very Mild Dementia: 70
      Mild Dementia: 28
      Moderate Dementia: 2
    split_subjects:
      train: 165
      val: 34
      test: 36
    split_images_128:
      train: 3300
      val: 680
      test: 720

  OASIS_2:
    selection: "last available MRI visit per subject, same-visit CDR, mpr-1"
    subjects:
      Non-Demented: 73
      Very Mild Dementia: 53
      Mild Dementia: 21
      Moderate Dementia: 3
    split_subjects:
      train: 104
      val: 23
      test: 23
    split_images_128:
      train: 2080
      val: 460
      test: 460

preprocessing:
  canonical_orientation: true
  native_shape: [256, 256, 128]
  native_voxel_spacing_mm: [1.0, 1.0, 1.25]
  robust_percentiles: [1, 99]
  normalize_to: [0, 1]
  restore_background_zero: true
  slices_per_subject: 20
  axial_depth_fraction: [0.30, 0.70]
  canonical_resolution: [128, 128]
  resize: bilinear
  output: "8-bit grayscale PNG"

distortions:
  final_protocol: "dataset-specific calibration on clean training subjects"
  target_ssim: {mild: 0.95, moderate: 0.85, severe: 0.70}
  selection: "parameter with closest median subject-level SSIM"
  frozen_before_held_out_testing: true
  calibrated_parameter_manifest: "not yet supplied in repository"
  distortion_families: [motion, rician_noise, rotation, gaussian_blur, brightness_contrast]
  legacy_fixed_parameter_generator: "scripts/distortions/generate_distortions.py"
  warning: "legacy generator DOES NOT reproduce final calibrated protocol"

models:
  RandomForest:
    n_estimators: 300
    max_depth: 10
    max_features: sqrt
    class_weight: balanced_subsample
  LinearSVM:
    scaler: StandardScaler
    C: 1.0
    class_weight: balanced
    max_iter: 1000
  SimpleCNN:
    channels: [32, 64, 128]
    dropout: 0.30
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.0001
  ResNet18:
    pretrained: false
    input_channels: 1
    optimizer: SGD
    learning_rate: 0.01
    momentum: 0.9
    weight_decay: 0.0001

deep_learning:
  batch_size: 32
  max_epochs: 20
  early_stopping_patience: 5
  checkpoint_metric: validation_macro_f1
  loss: weighted_cross_entropy
  class_weight_formula: "sqrt(N/N_c), normalized to mean 1"

classical_ml:
  primary_resolution: 128
  legacy_sensitivity_resolutions: [32, 64]

robustness:
  ARR: "corrupted_accuracy / clean_accuracy * 100"
  DRI: "mean ARR across all 15 distortion-severity conditions per dataset/task/model"
  interpretation: "heuristic only: >=90 high; 75 to <90 moderate; 60 to <75 fragile; <60 low"
  CD_DRI: "mean of OASIS-1 and OASIS-2 DRI"

statistics:
  independent_unit: subject
  bootstrap_resamples: 2000
  bootstrap: "subject-clustered mean delta accuracy and 95 percent CI per distortion"
  severity_comparisons: "subject-clustered logistic GEE, seed adjusted, Holm over 3 severities vs clean"
  severity_trend: "ordered predictor GEE, Holm within distortion family"
  cross_dataset: "separate binary and multiclass GEE interaction tests"
  legacy_glmm_scripts_are_not_final: true

reader_study:
  total_images: 160
  clean_images: 10
  distorted_per_condition: 10
  unique_source_slice_only: true
  display_resolution: [512, 512]
  ratings: [Readable, Borderline, Unreadable]
  initial_weighted_kappa: 0.420
  weighted_kappa_after_algorithmic_reconciliation: 0.674
  note: "readability only; thresholds are not clinically validated"
